<html>
    <head>
        <Style>
        body {
            background-color: #ffc400;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
        }

        </style>
        <title>my digital clock</title>
    </head>
    <body>
        <center>
    <div id="MyClockDisplay" onload="showTime()"></div>
    </center>
    
    
     
     
    <script>
     function showTime(){
        var date =new Date ();
        var h = date.getHours();
        var m  = date.getMinutes();
        var s = date.getSeconds();
        var session = "AM";

        if (h>12){
            h = h - 12; 
            session ="pm";

        }

        h = (h < 10) ? "0" + h : h;
        m = (m < 10)? "0" + m : m;
        s=(s < 10 ) ? "0" + s : s;
    var time = h+ ":"+ m + ":" + s + " " + session;
    document.getElementById("MyClockDisplay").innerText = time;
    setTimeout(showTime, 1000);
     }

     showTime();
    </script>
    </body>
</html>
